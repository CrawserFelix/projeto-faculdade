{% extends "ponto/base.html" %}

{% block content %}
<h2>Folhas de Ponto</h2>

<table>
  <thead>
    <tr>
      <th>Nome</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody>
    {% for profissional in profissionais %}
    <tr>
      <td>{{ profissional.usuario.get_full_name }}</td>
      <td>
        <a href="{% url 'visualizar_folha' profissional.id %}" class="botao-acao">Visualizar</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="2">Nenhum profissional encontrado.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
