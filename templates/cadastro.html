{% extends 'base.html' %}
{% load static %}
{% block title %}Cadastro{% endblock title %}

{% block conteudo %}
<h1>Cadastro de Usuário</h1>

<form id="cadastroForm" method="post">
    {% csrf_token %}

    <!-- Primeira linha -->
    <div class="form-row">
        <div class="form-group">
            <label for="nome_completo">Nome Completo:</label>
            <input type="text" id="nome_completo" name="nome_completo" required>
        </div>

        <div class="form-group">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" maxlength="14" required>
            <span id="erroCPF" style="color: red; font-size: 14px;"></span>
        </div>
    </div>

    <!-- Segunda linha -->
    <div class="form-row">
        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="cargo">Cargo:</label>
            <input type="text" id="cargo" name="cargo" required>
        </div>
    </div>

    <!-- Terceira linha -->
    <div class="form-row">
        <div class="form-group">
            <label for="gestor">Nome do Gestor:</label>
            <input type="text" id="gestor" name="gestor" required>
        </div>

        <div class="form-group">
            <label for="dataAdmissao">Data de Admissão:</label>
            <input type="date" id="dataAdmissao" name="dataAdmissao" required>
        </div>
    </div>

    <!-- Quarta linha -->
    <div class="form-row">
        <div class="form-group">
            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" required>
        </div>

        <div class="form-group">
            <label for="dataNascimento">Data de Nascimento:</label>
            <input type="date" id="dataNascimento" name="dataNascimento" required>
        </div>
    </div>

    <!-- Quinta linha -->
    <div class="form-row">
        <div class="form-group">
            <label for="remuneracao">Remuneração:</label>
            <input type="text" id="remuneracao" name="remuneracao" required>
        </div>

        <div class="form-group">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
        </div>
    </div>

    <!-- Botão -->
    <div class="form-actions">
        <button type="submit">Cadastrar</button>
    </div>
</form>

{% if messages %}
    <ul class="messages">
        {% for message in messages %}
            <li>{{ message }}</li>
        {% endfor %}
    </ul>
{% endif %}

<!-- JS -->
<script src="{% static 'js/cadastro.js' %}"></script>
{% endblock conteudo %}
